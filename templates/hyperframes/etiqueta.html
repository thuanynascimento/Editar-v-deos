<!-- MODELO: etiqueta do procedimento (folha de estilo Paulo Rosa Luz). Copie para compositions/<id>.html e troque __ID__.
     Traço caramelo + texto em maiúsculas espaçadas, no alto à esquerda. Variável: text ("Corte · finalização").
     Uma vez no começo ou ao mudar de etapa. Duração sugerida: 2,5–3,5 s. -->
<template>
  <style>
    #root { position: absolute; inset: 0; background: transparent; font-family: "Montserrat", sans-serif; }
    #__ID__-tag { position: absolute; left: 76px; top: 300px; display: flex; align-items: center; gap: 22px;
      color: #fff; font-size: 34px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase;
      text-shadow: 0 2px 16px rgba(0,0,0,.55), 0 1px 3px rgba(0,0,0,.35); opacity: 0; }
    #__ID__-bar { width: 54px; height: 3px; background: #D9985F; transform-origin: left center;
      box-shadow: 0 1px 6px rgba(0,0,0,.3); }
  </style>
  <div id="root" data-composition-id="__ID__" data-width="1080" data-height="1920"
       data-composition-variables='[{"id":"text","type":"string","label":"Procedimento","default":"Corte · finalização"}]'>
    <div id="__ID__-tag"><div id="__ID__-bar"></div><span data-var-text="text">Corte · finalização</span></div>
  </div>
  <script>
    (function () {
      const D = parseFloat(document.querySelector('[data-composition-id="__ID__"]').closest('[data-duration]')?.dataset.duration || 3);
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#__ID__-tag", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power1.out" }, 0)
        .fromTo("#__ID__-bar", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, 0.05)
        .to("#__ID__-tag", { opacity: 0, duration: 0.4, ease: "power1.in" }, Math.max(1, D - 0.45));
      window.__timelines["__ID__"] = tl;
    })();
  </script>
</template>

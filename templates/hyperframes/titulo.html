<!-- MODELO: título de tema (lower third). Copie para compositions/<id>.html e troque __ID__.
     Variáveis: kicker (texto pequeno), title (texto principal). Duração sugerida: 3–5 s. -->
<template>
  <style>
    #root { position: absolute; inset: 0; background: transparent; font-family: "Montserrat", sans-serif; }
    #__ID__-card { position: absolute; left: 120px; bottom: 170px; padding: 28px 44px 30px 40px;
      background: rgba(12, 13, 18, 0.82); border-radius: 18px; border-left: 10px solid var(--accent, #FFD43B);
      box-shadow: 0 18px 50px rgba(0,0,0,.45); opacity: 0; }
    #__ID__-kicker { color: var(--accent, #FFD43B); font-size: 30px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; }
    #__ID__-title { color: #fff; font-size: 68px; font-weight: 900; line-height: 1.05; margin-top: 8px; }
  </style>
  <div id="root" data-composition-id="__ID__" data-width="1920" data-height="1080"
       data-composition-variables='[{"id":"kicker","type":"string","label":"Chamada","default":"Hoje"},{"id":"title","type":"string","label":"Título","default":"Tema do vídeo"}]'>
    <div id="__ID__-card">
      <div id="__ID__-kicker" data-var-text="kicker">Hoje</div>
      <div id="__ID__-title" data-var-text="title">Tema do vídeo</div>
    </div>
  </div>
  <script>
    (function () {
      const D = parseFloat(document.querySelector('[data-composition-id="__ID__"]').closest('[data-duration]')?.dataset.duration || 4);
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#__ID__-card", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0)
        .fromTo("#__ID__-kicker", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power2.out" }, 0.2)
        .fromTo("#__ID__-title", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.32)
        .to("#__ID__-card", { opacity: 0, x: -40, duration: 0.35, ease: "power2.in" }, Math.max(1.2, D - 0.45));
      window.__timelines["__ID__"] = tl;
    })();
  </script>
</template>
